<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>Meatboxing</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@300;400;700&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto Condensed', Arial, sans-serif;
            background: #111 url('../bg.png') repeat fixed;
            background-size: 20vh;
            color: #fff;
        }

        .topbar {
            position: relative;
            height: 45px;
            background: #1e1e1e url('../header.png') top left repeat-x;
            display: flex;
            align-items: center;
            padding: 0 1em;
        }

        .topbar .title {
            font-weight: 400;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #fff;
            flex: 1;
        }

        .page {
            max-width: 860px;
            margin: 0 auto;
            padding: 2em 1.5em;
            display: flex;
            flex-direction: column;
            gap: 1.5em;
            background: rgba(0, 0, 0, 0.5);
        }

        .notice {
            background: #1a1500;
            border: 1px solid #3a2e00;
            border-left: 3px solid #FDC00F;
            padding: 0.8em 1em;
            font-size: 13px;
            color: #ccc;
            font-weight: 300;
        }

        .notice b {
            color: #FDC00F;
        }

        .label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #555;
            border-bottom: 1px solid #222;
            padding-bottom: 0.4em;
            margin-bottom: 0.8em;
        }

        @keyframes rborder {
            from {
                background-position: 0 0;
            }

            to {
                background-position: 1000px 0;
            }
        }

        hr {
            border: none;
            height: 1px;
            background: linear-gradient(90deg,
                    #7aafc4, #3dd4e0, #7de8d8, #b8e89e, #ffd86a,
                    #ffbf96, #f0a090, #ffb0a8, #ffbedd, #d4c8f8,
                    #96c8ff, #7aafc4);
            background-size: 500px 100%;
            animation: rborder 30s linear infinite;
        }

        a {
            text-decoration: none;
            background: linear-gradient(90deg,
                    #7aafc4, #3dd4e0, #7de8d8, #b8e89e, #ffd86a,
                    #ffbf96, #f0a090, #ffb0a8, #ffbedd, #d4c8f8,
                    #96c8ff, #7aafc4);
            background-size: 500px 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: rborder 30s linear infinite;
        }

        a:hover {
            opacity: 0.7;
        }

        a:active {
            opacity: 0.5;
        }

        .links {
            display: flex;
            gap: 0.5em;
            flex-wrap: wrap;
        }

        .links a {
            font-size: 13px;
            color: #aaa;
            -webkit-text-fill-color: #aaa;
            -webkit-background-clip: border-box;
            background-clip: border-box;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: calc(0.4em - 1px) calc(0.9em - 1px);
            position: relative;
            border: 1.5px solid transparent;
            background:
                linear-gradient(#111, #111111D9) padding-box,
                linear-gradient(90deg,
                    #577a8e,
                    #2aa3ae,
                    #5fbaa8,
                    #90b67d,
                    #ebc151,
                    #e49f80,
                    #ca836f,
                    #db8c85,
                    #dd9eb9,
                    #b5a8d4,
                    #74a0cd,
                    #577a8e) border-box;
            background-size: auto, 500px 100%;
            animation: rborder 30s linear infinite;
            opacity: 1;
        }

        .links a:hover {
            color: #fff;
            -webkit-text-fill-color: #fff;
            opacity: 1;
        }

        .links a:active {
            opacity: 1;
        }

        .footer {
            padding-top: 5px;
            font-size: 12px;
            color: #444;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .desc-content {
            font-size: 13px;
            font-weight: 300;
            color: #ccc;
            line-height: 1.6;
        }

        .desc-content h1 {
            font-size: 16px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 0.5em;
        }

        .desc-content h2 {
            font-size: 13px;
            font-weight: 700;
            color: #fff;
            margin-top: 0.5em;
            margin-bottom: 0.2em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .desc-content p {
            margin-bottom: 0.1em;
        }

        .desc-content b {
            color: #FDC00F;
        }
    </style>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-EGBYVCC0M2"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-EGBYVCC0M2');
    </script>
</head>

<body>
    <div class="topbar">
        <span class="title"><b><a href="/">Meatboxing</a></b></span>
    </div>
    <main class="page">
        <h1>Meatboxing</h1>
        <div>
            <div class="label">About Me</div>
            <div class="content">
                <span>My <a href="https://www.youtube.com/@meatboxing" target="_blank">YouTube</a></span>
                <br>
                <span>My <a href="https://www.x.com/@meatboxing" target="_blank">Twitter</a></span>
            </div>
        </div>
        <div>
            <div class="label">Pages</div>
            <div class="content">
                <a href="mods" target="_blank">Mods for My Videos</a>
                <br>
                <a href="scripts" target="_blank">Scripts for My Videos</a>
                <br>
                <a href="tables" target="_blank">Tables for My Videos</a>
            </div>
        </div>
        <hr>
        <div class="footer">
            <span>cr7jrsuii.github.io</span>
            <iframe src="https://www.youtube.com/subscribe_embed?channelid=UC4xtww2ppmmFnmOl3-C0owQ&layout=default"
                width="114" height="24" frameborder="0" title="Subscribe to Meatboxing on YouTube"></iframe>
        </div>
    </main>
</body>

</html>
